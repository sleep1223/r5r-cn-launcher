[project]
name = "r5r-patch-builder"
version = "0.1.0"
description = "Build R5R launcher patch zip packages from checksums.json manifests."
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.4",
    "ruff>=0.14.6",
]

[project.scripts]
r5r-build-patch = "patch_builder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_builder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnusedCallResult = false
